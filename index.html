<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sắp Ra Mắt</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 1rem; }
        p { font-size: 1.2rem; opacity: 0.9; max-width: 500px; margin-bottom: 2rem; }
        .subscribe-form { display: flex; gap: 10px; width: 90%; max-width: 400px; }
        input { flex: 1; padding: 12px 16px; border-radius: 6px; border: none; outline: none; font-size: 1rem; }
        button { padding: 12px 20px; background-color: #ff758c; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #ff758c; opacity: 0.9; }
    </style>
</head>
<body>
    <h1>Trang Web Sắp Ra Mắt</h1>
    <p>Chúng tôi đang tích cực hoàn thiện dự án. Hãy để lại email để nhận thông báo mới nhất!</p>
    <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Cảm ơn bạn đã đăng ký!');">
        <input type="email" placeholder="Nhập email của bạn..." required>
        <button type="submit">Gửi</button>
    </form>
</body>
</html>
