<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VHS Horror Player - Phieeny</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Khung màn hình VHS full màn hình */
        .tv-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Hiệu ứng chớp tắt nhiễu sóng màn hình */
        .glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            opacity: 0;
            pointer-events: none;
            mix-blend-mode: difference;
            transition: opacity 0.05s ease;
            z-index: 5;
        }

        /* Nhãn hiển thị góc màn hình */
        .vhs-info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff4fd8;
            text-shadow: 2px 2px #35d8ff;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 10;
            pointer-events: none;
        }

        /* Bảng nút bấm ở góc dưới */
        .controls {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .vhs-btn {
            background: rgba(17, 24, 39, 0.85);
            color: #ff4fd8;
            border: 2px solid #ff4fd8;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255, 79, 216, 0.4);
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }

        .vhs-btn:hover {
            background: #ff4fd8;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 79, 216, 0.8);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="tv-container">
        <!-- Video mặc định phát video cũ (video.mp4) -->
        <video id="vhsVideo" src="video.mp4" autoplay loop muted playsinline></video>
        
        <!-- Màn hình nhiễu sóng giật lag khi chuyển bài -->
        <div class="glitch-overlay" id="glitch"></div>
        
        <!-- Tên băng VHS -->
        <div class="vhs-info" id="tapeLabel">PLAYING: TAPE #1</div>

        <!-- Bảng nút chuyển bài -->
        <div class="controls">
            <button class="vhs-btn" onclick="changeTape(-1)">◀ PREV TAPE</button>
            <button class="vhs-btn" onclick="changeTape(1)">NEXT TAPE ▶</button>
        </div>
    </div>

    <!-- File âm thanh hù dọa khi bấm chuyển băng -->
    <audio id="scareSound" src="scare.mp3" preload="auto"></audio>

    <script>
        // 📜 Danh sách 4 video: video cũ + 3 video mới
        const playlist = [
            "video.mp4",  // Tape 1: Video cũ của bạn
            "video2.mp4", // Tape 2: Video mới 1
            "video3.mp4", // Tape 3: Video mới 2
            "video4.mp4"  // Tape 4: Video mới 3
        ];
        
        let currentIndex = 0;

        const video = document.getElementById('vhsVideo');
        const glitch = document.getElementById('glitch');
        const label = document.getElementById('tapeLabel');
        const scareSound = document.getElementById('scareSound');

        function changeTape(direction) {
            // 1. Phát tiếng hét / hù dọa
            scareSound.currentTime = 0;
            scareSound.play().catch(e => console.log("Cần chạm tương tác màn hình trước để phát tiếng"));

            // 2. Tạo hiệu ứng nhiễu sóng
            glitch.style.opacity = "1";
            setTimeout(() => {
                glitch.style.opacity = "0";
            }, 150);

            // 3. Tính toán video tiếp theo
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = playlist.length - 1;
            if (currentIndex >= playlist.length) currentIndex = 0;

            // 4. Chuyển video và đổi nhãn TAPE
            setTimeout(() => {
                video.src = playlist[currentIndex];
                video.play();
                label.innerText = `PLAYING: TAPE #${currentIndex + 1}`;
            }, 80);
        }
    </script>

</body>
</html>
