<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VHS Horror Player - Phieeny</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Khung màn hình TV chứa video */
        .tv-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }

        /* Hiệu ứng chớp nhiễu màn hình khi đổi video */
        .glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            opacity: 0;
            pointer-events: none;
            mix-blend-mode: difference;
            transition: opacity 0.05s ease;
            z-index: 20;
        }

        /* Nhãn TAPE hiển thị góc trên */
        .vhs-info {
            position: absolute;
            top: 25px;
            left: 20px;
            color: #ff4fd8;
            text-shadow: 2px 2px #35d8ff;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 30;
            pointer-events: none;
        }

        /* Bảng nút bấm cố định dưới đáy màn hình */
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 40;
            width: 90%;
            max-width: 400px;
            justify-content: center;
        }

        .vhs-btn {
            flex: 1;
            background: rgba(17, 24, 39, 0.9);
            color: #ff4fd8;
            border: 2px solid #ff4fd8;
            padding: 12px 10px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 0 12px rgba(255, 79, 216, 0.5);
            backdrop-filter: blur(8px);
            text-align: center;
            white-space: nowrap;
        }

        .vhs-btn:active {
            background: #ff4fd8;
            color: #fff;
            transform: scale(0.95);
        }
    </style>
</head>
<body onclick="unlockAudio()">

    <div class="tv-container">
        <!-- Video phát -->
        <video id="vhsVideo" src="video.mp4" autoplay loop playsinline></video>
        
        <!-- Màn hình giật nhiễu -->
        <div class="glitch-overlay" id="glitch"></div>
        
        <!-- Chữ góc trên -->
        <div class="vhs-info" id="tapeLabel">PLAYING: TAPE #1</div>
    </div>

    <!-- Nút bấm cố định dưới màn hình -->
    <div class="controls">
        <button class="vhs-btn" onclick="changeTape(-1, event)">◀ PREV TAPE</button>
        <button class="vhs-btn" onclick="changeTape(1, event)">NEXT TAPE ▶</button>
    </div>

    <!-- Âm thanh hù dọa -->
    <audio id="scareSound" src="scare.mp3" preload="auto"></audio>

    <script>
        // Danh sách các video trong repository của bạn
        const playlist = [
            "video.mp4",  // Tape 1: Video cũ
            "video2.mp4", // Tape 2: Video mới 1
            "video3.mp4", // Tape 3: Video mới 2
            "video4.mp4"  // Tape 4: Video mới 3
        ];
        
        let currentIndex = 0;
        let audioUnlocked = false;

        const video = document.getElementById('vhsVideo');
        const glitch = document.getElementById('glitch');
        const label = document.getElementById('tapeLabel');
        const scareSound = document.getElementById('scareSound');

        // Mở khóa âm thanh trên trình duyệt di động khi người dùng chạm màn hình
        function unlockAudio() {
            if (!audioUnlocked) {
                video.muted = false;
                scareSound.play().then(() => {
                    scareSound.pause();
                    scareSound.currentTime = 0;
                }).catch(() => {});
                audioUnlocked = true;
            }
        }

        function changeTape(direction, event) {
            if (event) event.stopPropagation(); // Ngăn sự kiện chạm trùng
            
            // 1. Phát tiếng hét
            scareSound.currentTime = 0;
            scareSound.play().catch(() => {});

            // 2. Tạo hiệu ứng chớp màn hình
            glitch.style.opacity = "1";
            setTimeout(() => {
                glitch.style.opacity = "0";
            }, 120);

            // 3. Tính toán video tiếp theo
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = playlist.length - 1;
            if (currentIndex >= playlist.length) currentIndex = 0;

            // 4. Đổi video và đảm bảo bật tiếng
            setTimeout(() => {
                video.src = playlist[currentIndex];
                video.muted = false;
                video.play();
                label.innerText = `PLAYING: TAPE #${currentIndex + 1}`;
            }, 80);
        }
    </script>

</body>
</html>
