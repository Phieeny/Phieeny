<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Interactive Cat</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg1: #080b1d;
    --bg2: #171044;
    --pink: #ff4fd8;
    --purple: #8b5cff;
    --blue: #35d8ff;
    --cyan: #5fffe0;
    --yellow: #ffe66d;
    --text: #ffffff;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #44207d 0%, transparent 35%),
        radial-gradient(circle at 80% 30%, #0e6485 0%, transparent 30%),
        radial-gradient(circle at 50% 100%, #39125e 0%, transparent 45%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
}

/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -10;
}

.aurora {
    position: absolute;
    width: 70vw;
    height: 70vw;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .22;
    animation: auroraMove 12s ease-in-out infinite alternate;
}

.aurora.one {
    background: #ff26d9;
    left: -20%;
    top: -30%;
}

.aurora.two {
    background: #2677ff;
    right: -20%;
    top: 15%;
    animation-delay: -4s;
}

.aurora.three {
    background: #00ffd5;
    left: 30%;
    bottom: -50%;
    animation-delay: -7s;
}

@keyframes auroraMove {
    from {
        transform: translate3d(-4%, -3%, 0) scale(1);
    }

    to {
        transform: translate3d(5%, 5%, 0) scale(1.2);
    }
}

.grid {
    position: absolute;
    inset: 0;
    opacity: .12;
    background-image:
        linear-gradient(rgba(255,255,255,.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.25) 1px, transparent 1px);
    background-size: 55px 55px;
    transform: perspective(600px) rotateX(55deg) translateY(30%);
    transform-origin: center bottom;
    animation: gridMove 10s linear infinite;
}

@keyframes gridMove {
    from {
        background-position: 0 0;
    }

    to {
        background-position: 0 55px;
    }
}

/* =========================================================
   PARTICLES
========================================================= */

#particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 0 8px currentColor,
        0 0 18px currentColor;
    animation: floatParticle linear infinite;
}

@keyframes floatParticle {
    from {
        transform: translateY(110vh) translateX(0) scale(.3);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    90% {
        opacity: .8;
    }

    to {
        transform: translateY(-20vh) translateX(var(--drift)) scale(1);
        opacity: 0;
    }
}

/* =========================================================
   MAIN APP
========================================================= */

.app {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position: absolute;
    top: 25px;
    left: 30px;
    right: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 14px;
}

.logo-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow:
        0 0 10px var(--cyan),
        0 0 25px var(--cyan);
    animation: pulse 1.8s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.45);
        opacity: .5;
    }
}

.status {
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(12px);
    font-size: 12px;
    color: #cfd4ff;
}

/* =========================================================
   CAT AREA
========================================================= */

.cat-stage {
    position: relative;
    width: min(760px, 95vw);
    height: min(590px, 65vh);
    min-height: 430px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* neon ring behind cat */

.energy-ring {
    position: absolute;
    width: 430px;
    height: 430px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow:
        0 0 30px rgba(255,79,216,.15),
        inset 0 0 30px rgba(53,216,255,.1);
    animation: ringSpin 18s linear infinite;
}

.energy-ring::before,
.energy-ring::after {
    content: "";
    position: absolute;
    inset: 25px;
    border-radius: 50%;
    border: 1px dashed rgba(95,255,224,.2);
}

.energy-ring::after {
    inset: 55px;
    border-color: rgba(255,79,216,.2);
}

@keyframes ringSpin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   CAT SVG
========================================================= */

.cat-wrapper {
    position: relative;
    width: 480px;
    max-width: 85vw;
    z-index: 5;
    cursor: pointer;
    animation: catFloat 3.5s ease-in-out infinite;
}

@keyframes catFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-13px);
    }
}

.cat-svg {
    width: 100%;
    height: auto;
    overflow: visible;
    filter:
        drop-shadow(0 20px 30px rgba(0,0,0,.4))
        drop-shadow(0 0 20px rgba(255,79,216,.15));
}

/* body */

.cat-body {
    transform-origin: center bottom;
    animation: breathing 3s ease-in-out infinite;
}

@keyframes breathing {
    0%, 100% {
        transform: scaleY(1);
    }

    50% {
        transform: scaleY(1.025);
    }
}

/* ears */

.ear {
    transform-origin: center bottom;
    transition: transform .25s ease;
}

.ear-left {
    animation: earIdleLeft 4s ease-in-out infinite;
}

.ear-right {
    animation: earIdleRight 4.5s ease-in-out infinite;
}

@keyframes earIdleLeft {
    0%, 80%, 100% {
        transform: rotate(0);
    }

    85% {
        transform: rotate(-8deg);
    }

    90% {
        transform: rotate(4deg);
    }
}

@keyframes earIdleRight {
    0%, 75%, 100% {
        transform: rotate(0);
    }

    80% {
        transform: rotate(7deg);
    }

    85% {
        transform: rotate(-3deg);
    }
}

/* tail */

.tail {
    transform-origin: 360px 380px;
    animation: tailMove 2.8s ease-in-out infinite;
}

@keyframes tailMove {
    0%, 100% {
        transform: rotate(-4deg);
    }

    50% {
        transform: rotate(8deg);
    }
}

/* legs */

.leg {
    transform-origin: top center;
}

.leg-back {
    animation: legBack 4s ease-in-out infinite;
}

.leg-front {
    animation: legFront 4s ease-in-out infinite;
}

@keyframes legBack {
    0%, 100% {
        transform: rotate(0);
    }

    50% {
        transform: rotate(-2deg);
    }
}

@keyframes legFront {
    0%, 100% {
        transform: rotate(0);
    }

    50% {
        transform: rotate(2deg);
    }
}

/* eyes */

.eye {
    transition: transform .12s ease;
}

.pupil {
    transition: transform .12s ease;
}

.blink {
    animation: blink 5s infinite;
    transform-origin: center;
}

@keyframes blink {
    0%, 44%, 48%, 100% {
        transform: scaleY(1);
    }

    46% {
        transform: scaleY(.08);
    }
}

/* whiskers */

.whisker {
    stroke-linecap: round;
    opacity: .8;
}

/* =========================================================
   SPEECH BUBBLE
========================================================= */

.speech {
    position: absolute;
    top: 35px;
    right: 30px;
    min-width: 190px;
    max-width: 260px;
    padding: 15px 18px;
    border-radius: 20px;
    background: rgba(15,17,42,.72);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(18px);
    box-shadow:
        0 15px 50px rgba(0,0,0,.25),
        0 0 30px rgba(139,92,255,.12);
    z-index: 10;
    animation: speechFloat 3s ease-in-out infinite;
}

.speech::after {
    content: "";
    position: absolute;
    left: 35px;
    bottom: -9px;
    width: 18px;
    height: 18px;
    background: rgba(15,17,42,.72);
    border-right: 1px solid rgba(255,255,255,.14);
    border-bottom: 1px solid rgba(255,255,255,.14);
    transform: rotate(45deg);
}

.speech-name {
    font-size: 11px;
    color: var(--pink);
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 5px;
}

.speech-text {
    font-size: 14px;
    line-height: 1.45;
    color: #f1f3ff;
}

@keyframes speechFloat {
    50% {
        transform: translateY(-6px);
    }
}

/* =========================================================
   STATUS BARS
========================================================= */

.stats {
    position: absolute;
    left: 30px;
    bottom: 30px;
    width: 220px;
    padding: 15px;
    border-radius: 18px;
    background: rgba(10,12,31,.6);
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(15px);
    z-index: 10;
}

.stat {
    margin-bottom: 12px;
}

.stat:last-child {
    margin-bottom: 0;
}

.stat-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #aeb5d6;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .08em;
}

.bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,.08);
    border-radius: 999px;
    overflow: hidden;
}

.bar-fill {
    height: 100%;
    width: 70%;
    border-radius: inherit;
    transition: width .5s ease;
    background: linear-gradient(90deg, #ff4fd8, #8b5cff, #35d8ff);
    box-shadow: 0 0 10px rgba(139,92,255,.5);
}

/* =========================================================
   CONTROLS
========================================================= */

.controls {
    position: absolute;
    bottom: 30px;
    right: 30px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
    z-index: 20;
}

.action {
    min-width: 105px;
    padding: 11px 13px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    background: rgba(255,255,255,.06);
    color: white;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    backdrop-filter: blur(15px);
}

.action:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,.12);
    border-color: rgba(255,255,255,.3);
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

.action:active {
    transform: scale(.95);
}

.action.feed:hover {
    box-shadow: 0 0 25px rgba(255,230,109,.2);
}

.action.pet:hover {
    box-shadow: 0 0 25px rgba(255,79,216,.2);
}

.action.talk:hover {
    box-shadow: 0 0 25px rgba(53,216,255,.2);
}

/* =========================================================
   COLOR ORBS
========================================================= */

.color-panel {
    position: absolute;
    top: 85px;
    left: 30px;
    display: flex;
    gap: 7px;
    padding: 8px;
    border-radius: 999px;
    background: rgba(10,12,31,.55);
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(12px);
    z-index: 20;
}

.color {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.5);
    transition: transform .2s ease;
}

.color:hover {
    transform: scale(1.25);
}

/* =========================================================
   LOVE HEARTS / FOOD / EFFECTS
========================================================= */

.effect {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    animation: effectUp 1.3s ease forwards;
}

.heart {
    font-size: 24px;
    filter: drop-shadow(0 0 10px currentColor);
}

.food {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffb86b;
    box-shadow: 0 0 15px #ffb86b;
}

@keyframes effectUp {
    0% {
        opacity: 0;
        transform: translateY(10px) scale(.5) rotate(0);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateY(-120px) scale(1.2) rotate(25deg);
    }
}

/* =========================================================
   PETTING HAND
========================================================= */

.hand {
    position: absolute;
    width: 65px;
    height: 65px;
    border: 2px solid rgba(255,255,255,.4);
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%) scale(.5);
    transition: .3s ease;
    z-index: 40;
}

.hand.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: rgba(255,255,255,.3);
    letter-spacing: .12em;
    text-transform: uppercase;
}

/* =========================================================
   SPECIAL STATES
========================================================= */

.cat-happy .cat-wrapper {
    animation:
        catFloat 3.5s ease-in-out infinite,
        happyBounce .55s ease;
}

@keyframes happyBounce {
    0% { transform: scale(1); }
    30% { transform: scale(1.08) rotate(-2deg); }
    60% { transform: scale(.98) rotate(2deg); }
    100% { transform: scale(1); }
}

.cat-eating .cat-body {
    animation: eating .4s ease-in-out infinite alternate;
}

@keyframes eating {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(5px);
    }
}

.cat-angry .ear-left {
    transform: rotate(-15deg);
}

.cat-angry .ear-right {
    transform: rotate(15deg);
}

.cat-sleeping .cat-wrapper {
    animation: sleepFloat 4s ease-in-out infinite;
}

@keyframes sleepFloat {
    50% {
        transform: translateY(8px);
    }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {
    .header {
        top: 15px;
        left: 15px;
        right: 15px;
    }

    .status {
        display: none;
    }

    .cat-stage {
        height: 620px;
    }

    .speech {
        top: 20px;
        right: 10px;
        transform: scale(.85);
        transform-origin: right top;
    }

    .stats {
        left: 15px;
        bottom: 85px;
        width: 180px;
        transform: scale(.85);
        transform-origin: left bottom;
    }

    .controls {
        right: 15px;
        bottom: 20px;
        grid-template-columns: repeat(2, 95px);
    }

    .action {
        min-width: 0;
        font-size: 10px;
        padding: 10px;
    }

    .color-panel {
        top: 60px;
        left: 15px;
    }

    .energy-ring {
        width: 330px;
        height: 330px;
    }

    .cat-wrapper {
        width: 390px;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="aurora one"></div>
    <div class="aurora two"></div>
    <div class="aurora three"></div>
    <div class="grid"></div>
</div>

<div id="particles"></div>

<div class="app" id="app">

    <!-- HEADER -->

    <header class="header">
        <div class="logo">
            <span class="logo-dot"></span>
            Interactive Cat
        </div>

        <div class="status">
            ● ONLINE · CAT SYSTEM ACTIVE
        </div>
    </header>

    <!-- COLOR SELECTOR -->

    <div class="color-panel">

        <div
            class="color"
            data-color="#ff7ac8"
            style="background:#ff7ac8"
        ></div>

        <div
            class="color"
            data-color="#9b7cff"
            style="background:#9b7cff"
        ></div>

        <div
            class="color"
            data-color="#58d9ff"
            style="background:#58d9ff"
        ></div>

        <div
            class="color"
            data-color="#6dffb3"
            style="background:#6dffb3"
        ></div>

        <div
            class="color"
            data-color="#ffd86b"
            style="background:#ffd86b"
        ></div>

        <div
            class="color"
            data-color="#ff6b6b"
            style="background:#ff6b6b"
        ></div>

    </div>

    <!-- CAT AREA -->

    <main class="cat-stage" id="stage">

        <div class="energy-ring"></div>

        <!-- SPEECH -->

        <div class="speech">
            <div class="speech-name">Mochi</div>
            <div class="speech-text" id="speechText">
                Hello! I'm Mochi ✦
            </div>
        </div>

        <!-- CAT -->

        <div class="cat-wrapper" id="cat">

            <svg
                class="cat-svg"
                viewBox="0 0 500 500"
                xmlns="http://www.w3.org/2000/svg"
            >

                <defs>

                    <!-- BODY GRADIENT -->

                    <linearGradient
                        id="fur"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1"
                    >
                        <stop
                            offset="0%"
                            stop-color="#ff7ac8"
                            id="fur1"
                        />

                        <stop
                            offset="50%"
                            stop-color="#9b7cff"
                            id="fur2"
                        />

                        <stop
                            offset="100%"
                            stop-color="#4ddcff"
                            id="fur3"
                        />
                    </linearGradient>

                    <!-- EAR INNER -->

                    <linearGradient
                        id="earInner"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1"
                    >
                        <stop offset="0%" stop-color="#ffb7ea"/>
                        <stop offset="100%" stop-color="#a98aff"/>
                    </linearGradient>

                    <!-- EYE -->

                    <radialGradient id="eyeGradient">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="30%" stop-color="#dffcff"/>
                        <stop offset="100%" stop-color="#46dfff"/>
                    </radialGradient>

                    <!-- GLOW -->

                    <filter id="glow">
                        <feGaussianBlur
                            stdDeviation="4"
                            result="blur"
                        />

                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>

                </defs>

                <!-- SHADOW -->

                <ellipse
                    cx="250"
                    cy="452"
                    rx="145"
                    ry="25"
                    fill="rgba(0,0,0,.35)"
                />

                <!-- TAIL -->

                <g class="tail">

                    <path

                        M365 365
                        C430 350 448 290 416 265
                        C400 253 381 264 388 280
                        C400 309 377 326 350 324
                        "
                        fill="none"
                        stroke="url(#fur)"
                        stroke-width="38"
                        stroke-linecap="round"
                    />

                    <path
                        d="
                        M365 365
                        C430 350 448 290 416 265
                        "
                        fill="none"
                        stroke="rgba(255,255,255,.15)"
                        stroke-width="6"
                        stroke-linecap="round"
                    />

                </g>

                <!-- BODY -->

                <g class="cat-body">

                    <ellipse
                        cx="250"
                        cy="345"
                        rx="135"
                        ry="120"
                        fill="url(#fur)"
                    />

                    <!-- BELLY -->

                    <ellipse
                        cx="250"
                        cy="370"
                        rx="90"
                        ry="78"
                        fill="rgba(255,255,255,.12)"
                    />

                    <!-- BACK LEG -->

                    <g class="leg leg-back">

                        <ellipse
                            cx="185"
                            cy="422"
                            rx="48"
                            ry="29"
                            fill="url(#fur)"
                        />

                        <ellipse
                            cx="178"
                            cy="431"
                            rx="33"
                            ry="16"
                            fill="rgba(255,255,255,.12)"
                        />

                    </g>

                    <!-- FRONT LEG -->

                    <g class="leg leg-front">

                        <ellipse
                            cx="315"
                            cy="420"
                            rx="48"
                            ry="29"
                            fill="url(#fur)"
                        />

                        <ellipse
                            cx="320"
                            cy="430"
                            rx="32"
                            ry="15"
                            fill="rgba(255,255,255,.12)"
                        />

                    </g>

                    <!-- HEAD -->

                    <ellipse
                        cx="250"
                        cy="220"
                        rx="140"
                        ry="120"
                        fill="url(#fur)"
                    />

                    <!-- LEFT EAR -->

                    <g class="ear ear-left">

                        <path
                            d="
                            M130 165
                            L122 58
                            Q120 38 138 49
                            L215 122
                            Z
                            "
                            fill="url(#fur)"
                        />

                        <path
                            d="
                            M143 126
                            L138 78
                            L184 119
                            Z
                            "
                            fill="url(#earInner)"
                        />

                    </g>

                    <!-- RIGHT EAR -->

                    <g class="ear ear-right">

                        <path
                            d="
                            M370 165
                            L378 58
                            Q380 38 362 49
                            L285 122
                            Z
                            "
                            fill="url(#fur)"
                        />

                        <path
                            d="
                            M357 126
                            L362 78
                            L316 119
                            Z
                            "
                            fill="url(#earInner)"
                        />

                    </g>

                    <!-- FACE LIGHT -->

                    <ellipse
                        cx="250"
                        cy="270"
                        rx="108"
                        ry="65"
                        fill="rgba(255,255,255,.09)"
                    />

                    <!-- EYES -->

                    <g class="eye blink" id="leftEye">

                        <ellipse
                            cx="195"
                            cy="218"
                            rx="29"
                            ry="34"
                            fill="#11152d"
                        />

                        <ellipse
                            cx="195"
                            cy="218"
                            rx="20"
                            ry="25"
                            fill="url(#eyeGradient)"
                        />

                        <ellipse
                            class="pupil"
                            id="leftPupil"
                            cx="195"
                            cy="218"
                            rx="7"
                            ry="13"
                            fill="#07101f"
                        />

                        <circle
                            cx="188"

                💬 Talk
            </button>

            <button class="action" id="play">
                ✧ Play

</div>


<script>

/* =========================================================
   BASIC STATE
========================================================= */

const state = {

    happiness: 82,
    energy: 74,
    hunger: 36,

    color: "#ff7ac8",

    mood: "happy",

    sleeping: false,

    messages: [

        "Hello! I'm Mochi ✦",
        "Did you come to visit me?",
        "I was waiting for you!",
        "Can we play?",
        "Your cursor is following me...",
        "I like attention!",
        "Meow~",
        "You look interesting.",
        "Give me some food!",
        "I feel wonderful today."
    ],

    messageIndex: 0

};


/* =========================================================
   DOM
========================================================= */

const app =
    document.getElementById("app");

const cat =
    document.getElementById("cat");

const stage =
    document.getElementById("stage");

const speech =
    document.getElementById("speechText");

const hand =
    document.getElementById("hand");

const happyBar =
    document.getElementById("happyBar");

const energyBar =
    document.getElementById("energyBar");

const hungerBar =
    document.getElementById("hungerBar");

const happyValue =
    document.getElementById("happyValue");

const energyValue =
    document.getElementById("energyValue");

const hungerValue =
    document.getElementById("hungerValue");

const fur1 =
    document.getElementById("fur1");

const fur2 =
    document.getElementById("fur2");

const fur3 =
    document.getElementById("fur3");

const leftPupil =
    document.getElementById("leftPupil");

const rightPupil =
    document.getElementById("rightPupil");


/* =========================================================
   PARTICLES
========================================================= */

function createParticles() {

    const container =
        document.getElementById("particles");

    const colors = [
        "#ff4fd8",
        "#35d8ff",
        "#8b5cff",
        "#5fffe0",
        "#ffe66d",
        "#ffffff"
    ];

    for (let i = 0; i < 70; i++) {

        const p =
            document.createElement("div");

        p.className = "particle";

        const size =
            Math.random() * 4 + 2;

        p.style.width = size + "px";
        p.style.height = size + "px";

        p.style.left =
            Math.random() * 100 + "%";

        p.style.animationDuration =
            (Math.random() * 12 + 8) + "s";

        p.style.animationDelay =
            -(Math.random() * 15) + "s";

        p.style.color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        p.style.setProperty(
            "--drift",
            (Math.random() * 180 - 90) + "px"
        );

        container.appendChild(p);
    }

}

createParticles();


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats() {

    state.happiness =
        Math.max(
            0,
            Math.min(
                100,
                state.happiness
            )
        );

    state.energy =
        Math.max(
            0,
            Math.min(
                100,
                state.energy
            )
        );

    state.hunger =
        Math.max(
            0,
            Math.min(
                100,
                state.hunger
            )
        );

    happyBar.style.width =
        state.happiness + "%";

    energyBar.style.width =
        state.energy + "%";

    hungerBar.style.width =
        state.hunger + "%";

    happyValue.textContent =
        Math.round(state.happiness) + "%";

    energyValue.textContent =
        Math.round(state.energy) + "%";

    hungerValue.textContent =
        Math.round(state.hunger) + "%";

}


/* =========================================================
   SPEECH
========================================================= */

function say(text) {

    speech.style.opacity = "0";

    setTimeout(() => {

        speech.textContent = text;

        speech.style.opacity = "1";

    }, 120);

}


/* =========================================================
   RANDOM TALK
========================================================= */

function randomTalk() {

    const message =
        state.messages[
            state.messageIndex %
            state.messages.length
        ];

    state.messageIndex++;

    say(message);

}


/* =========================================================
   EFFECTS
========================================================= */

function createHeart(x, y) {

    const heart =
        document.createElement("div");

    heart.className =
        "effect heart";

    heart.textContent =
        "♥";

    heart.style.left =
        x + "px";

    heart.style.top =
        y + "px";

    heart.style.color =
        state.color;

    document.body.appendChild(heart);

    setTimeout(
        () => heart.remove(),
        1400
    );

}


function createFood(x, y) {

    const food =
        document.createElement("div");

    food.className =
        "effect food";

    food.style.left =
        x + "px";

    food.style.top =
        y + "px";

    document.body.appendChild(food);

    setTimeout(
        () => food.remove(),
        1400
    );

}


/* =========================================================
   HAPPY EFFECT
========================================================= */

function happyAnimation() {

    app.classList.remove(
        "cat-happy"
    );

    void app.offsetWidth;

    app.classList.add(
        "cat-happy"
    );

    setTimeout(() => {

        app.classList.remove(
            "cat-happy"
        );

    }, 700);

}


/* =========================================================
   FEED
========================================================= */

document
    .getElementById("feed")
    .addEventListener(
        "click",
        () => {

            state.hunger -= 25;
            state.happiness += 9;

            if (state.hunger < 0) {
                state.hunger = 0;
            }

            say(
                "Mmm! That's delicious! ♡"
            );

            happyAnimation();

            for (let i = 0; i < 6; i++) {

                setTimeout(() => {

                    createFood(
                        window.innerWidth / 2 +
                        Math.random() * 100 - 50,

                        window.innerHeight / 2 +
                        Math.random() * 60
                    );

                }, i * 120);

            }

            updateStats();

        }
    );


/* =========================================================
   PET
========================================================= */

document
    .getElementById("pet")
    .addEventListener(
        "click",
        () => {

            state.happiness += 15;
            state.energy -= 3;

            say(
                "Prrrrrr... I like that. ♡"
            );

            happyAnimation();

            for (let i = 0; i < 8; i++) {

                setTimeout(() => {

                    const rect =
                        cat.getBoundingClientRect();

                    createHeart(
                        rect.left +
                        Math.random() *
                        rect.width,

                        rect.top +
                        Math.random() *
                        rect.height *
                        .55
                    );

                }, i * 100);

            }

            updateStats();

        }
    );


/* =========================================================
   TALK
========================================================= */

document
    .getElementById("talk")
    .addEventListener(
        "click",
        () => {

            randomTalk();

            state.happiness += 3;

            updateStats();

        }
    );


/* =========================================================
   PLAY
========================================================= */

document
    .getElementById("play")
    .addEventListener(
        "click",
        () => {

            if (state.energy < 15) {

                say(
                    "I'm too sleepy to play..."
                );

                return;

            }

            state.energy -= 15;
            state.happiness += 18;

            say(
                "Let's play! Catch me!"
            );

            happyAnimation();

            for (let i = 0; i < 12; i++) {

                setTimeout(() => {

                    createHeart(
                        Math.random() *
                        window.innerWidth,

                        Math.random() *
                        window.innerHeight
                    );

                }, i * 100);

            }

            updateStats();

        }
    );


/* =========================================================
   SLEEP
========================================================= */

document
    .getElementById("sleep")
    .addEventListener(
        "click",
        () => {

            state.sleeping =
                !state.sleeping;

            if (state.sleeping) {

                app.classList.add(
                    "cat-sleeping"
                );

                say(
                    "Zzz... wake me gently..."
                );

            } else {

                app.classList.remove(
                    "cat-sleeping"
                );

                say(
                    "Good morning! ✦"
                );

                state.energy += 25;

                updateStats();

            }

        }
    );


/* =========================================================
   DANCE
========================================================= */

document
    .getElementById("dance")
    .addEventListener(
        "click",
        () => {

            say(
                "Watch my moves! ♪"
            );

            cat.animate(

                [
                    {
                        transform:
                            "translateY(0) rotate(0)"
                    },

                    {
                        transform:
                            "translateY(-30px) rotate(-7deg)"
                    },

                    {
                        transform:
                            "translateY(0) rotate(7deg)"
                    },

                    {
                        transform:
                            "translateY(-25px) rotate(-7deg)"
                    },

                    {
                        transform:
                            "translateY(0) rotate(0)"
                    }
                ],

                {
                    duration: 1200,
                    easing:
                        "cubic-bezier(.68,-0.55,.27,1.55)"
                }

            );

            state.energy -= 10;
            state.happiness += 12;

            updateStats();

        }
    );


/* =========================================================
   CLICK CAT DIRECTLY
========================================================= */

cat.addEventListener(
    "click",
    (event) => {

        state.happiness += 7;

        say(
            "Hehe! You found my soft spot!"
        );

        createHeart(
            event.clientX,
            event.clientY
        );

        happyAnimation();

        updateStats();

    }
);


/* =========================================================
   COLOR SYSTEM
========================================================= */

document
    .querySelectorAll(".color")
    .forEach(
        color => {

            color.addEventListener(
                "click",
                () => {

                    const c =
                        color.dataset.color;

                    state.color = c;

                    changeCatColor(c);

                    say(
                        "Do you like my new color?"
                    );

                }
            );

        }
    );


function hexToRgb(hex) {

    hex = hex.replace("#", "");

    const bigint =
        parseInt(hex, 16);

    return {

        r:
            (bigint >> 16) & 255,

        g:
            (bigint >> 8) & 255,

        b:
            bigint & 255

    };

}


function mixColor(
    color,
    target,
    amount
) {

    const a =
        hexToRgb(color);

    const b =
        hexToRgb(target);

    const r =
        Math.round(
            a.r +
            (b.r - a.r) *
            amount
        );

    const g =
        Math.round(
            a.g +
            (b.g - a.g) *
            amount
        );

    const bl =
        Math.round(
            a.b +
            (b.b - a.b) *
            amount
        );

    return `rgb(${r},${g},${bl})`;

}


function changeCatColor(base) {

    fur1.setAttribute(
        "stop-color",
        base
    );

    fur2.setAttribute(
        "stop-color",
        mixColor(
            base,
            "#8b5cff",
            .45
        )
    );

    fur3.setAttribute(
        "stop-color",
        mixColor(
            base,
            "#35d8ff",
            .65
        )
    );

    document.documentElement.style
        .setProperty(
            "--pink",
            base
        );

}


/* =========================================================
   MOUSE TRACKING
========================================================= */

let mouseX = 250;
let mouseY = 220;

window.addEventListener(
    "mousemove",
    event => {

        mouseX = event.clientX;
        mouseY = event.clientY;

        updateEyes(
            event.clientX,
            event.clientY
        );

    }
);


function updateEyes(x, y) {

    const left =
        document
            .getElementById("leftEye")
            .getBoundingClientRect();

    const right =
        document
            .getElementById("rightEye")
            .getBoundingClientRect();

    movePupil(
        leftPupil,
        left,
        x,
        y
    );

    movePupil(
        rightPupil,
        right,
        x,
        y
    );

}


function movePupil(
    pupil,
    eye,
    x,
    y
) {

    const cx =
        eye.left +
        eye.width / 2;

    const cy =
        eye.top +
        eye.height / 2;

    let dx = x - cx;
    let dy = y - cy;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const max =
        7;

    if (distance > max) {

        dx =
            dx /
            distance *
            max;

        dy =
            dy /
            distance *
            max;

    }

    pupil.style.transform =
        `translate(${dx}px, ${dy}px)`;

}


/* =========================================================
   PETTING WITH POINTER
========================================================= */

let petTimeout;

cat.addEventListener(
    "pointermove",
    event => {

        const rect =
            cat.getBoundingClientRect();

        const x =
            event.clientX -
            rect.left;

        const y =
            event.clientY -
            rect.top;

        hand.style.left =
            event.clientX + "px";

        hand.style.top =
            event.clientY + "px";

        hand.classList.add(
            "active"
        );

        clearTimeout(
            petTimeout
        );

        petTimeout =
            setTimeout(() => {

                hand.classList.remove(
                    "active"
                );

            }, 250);

        if (
            Math.random() <
            .035
        ) {

            state.happiness += 1;

            updateStats();

        }

    }
);


/* =========================================================
   DOUBLE CLICK = SPECIAL REACTION
========================================================= */

cat.addEventListener(
    "dblclick",
    event => {

        say(
            "MEOOOOW! ✦✦✦"
        );

        happyAnimation();

        for (let i = 0; i < 20; i++) {

            setTimeout(() => {

                createHeart(
                    event.clientX +
                    Math.random() *
                    200 -
                    100,

                    event.clientY +
                    Math.random() *
                    100 -
                    50
                );

            }, i * 50);

        }

    }
);


/* =========================================================
   RANDOM IDLE BEHAVIOR
========================================================= */

setInterval(
    () => {

        if (
            state.sleeping
        ) return;

        const random =
            Math.random();

        if (
            random < .35
        ) {

            randomTalk();

        }

        if (
            random > .7
        ) {

            state.hunger += 2;
            state.energy -= 1;

            updateStats();

        }

    },

    7000
);


/* =========================================================
   COLOR CYCLE BACKGROUND
========================================================= */

let hue = 0;

setInterval(
    () => {

        hue += .35;

        const c1 =
            `hsl(${hue}, 90%, 65%)`;

        const c2 =
            `hsl(${hue + 70}, 90%, 60%)`;

        document
            .querySelector(".aurora.one")
            .style.background =
            c1;

        document
            .querySelector(".aurora.two")
            .style.background =
            c2;

    },

    100
);


/* =========================================================
   KEYBOARD INTERACTION
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        switch (
            event.key.toLowerCase()
        ) {

            case "f":

                document
                    .getElementById("feed")
                    .click();

                break;

            case "p":

                document
                    .getElementById("pet")
                    .click();

                break;

            case "t":

                document
                    .getElementById("talk")
                    .click();

                break;

            case "d":

                document
                    .getElementById("dance")
                    .click();

                break;

            case "s":

                document
                    .getElementById("sleep")
                    .click();

                break;

        }

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

updateStats();

setTimeout(
    () => {

        say(
            "Move your mouse around... I'll watch you."
        );

    },

    1800
);

</script>
