<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analogue Horror Experience</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Khung chứa màn hình VHS */
        .vhs-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* Video gốc hiển thị toàn màn hình */
        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: contrast(120%) brightness(90%);
        }

        /* Lớp phủ đường quét CRT tạo hiệu ứng VHS */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.3) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }

        /* Màn hình chờ bắt đầu */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .start-btn {
            padding: 15px 30px;
            background: transparent;
            color: #ff3333;
            border: 2px solid #ff3333;
            font-size: 1.2rem;
            font-family: inherit;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff3333;
            transition: 0.3s;
        }

        .start-btn:hover {
            background: #ff3333;
            color: #000;
            box-shadow: 0 0 20px #ff3333;
        }
    </style>
</head>
<body>

    <div class="vhs-container">
        <div class="scanlines"></div>

        <!-- Màn hình chờ bấm nút để phát (Bắt buộc vì trình duyệt chặn tự phát âm thanh) -->
        <div class="overlay" id="overlay">
            <button class="start-btn" onclick="playVideo()">PLAY TAPE</button>
        </div>

        <!-- Thay link video.mp4 của bạn vào thuộc tính src dưới đây -->
        <video id="horrorVideo" loop playsinline>
            <source src="video.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ thẻ video.
        </video>
    </div>

    <script>
        function playVideo() {
            const video = document.getElementById('horrorVideo');
            const overlay = document.getElementById('overlay');
            
            // Ẩn màn hình chờ và phát video
            overlay.style.display = 'none';
            video.play();
        }
    </script>
</body>
</html>
